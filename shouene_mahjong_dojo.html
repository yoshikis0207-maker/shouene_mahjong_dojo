<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>省エネ麻雀道場 - 何切る・押し引き練習</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: radial-gradient(ellipse at top, #0f3d2e 0%, #0a2a20 55%, #061a14 100%);
  color: #f3efe6;
  overscroll-behavior-y: contain;
  -webkit-user-select: none; user-select: none;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

/* ---------- Header ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
  background: linear-gradient(180deg, #16251c, #0f3d2e00);
}
.topbar .brand { display: flex; align-items: center; gap: 8px; }
.topbar .brand .tile-icon {
  width: 30px; height: 40px; background: #fffdf7; border-radius: 4px;
  box-shadow: 0 2px 4px rgba(0,0,0,.5), inset 0 0 0 1px #d8d0bd;
  display: flex; align-items: center; justify-content: center;
  color: #0f3d2e; font-weight: 700; font-size: 16px;
}
.topbar h1 { font-size: 16px; margin: 0; letter-spacing: .5px; font-weight: 700; color: #f6e9c7; }
.topbar .video-link {
  font-size: 11px; color: #b9f3d0; text-decoration: none; border: 1px solid #3a6b55;
  padding: 6px 10px; border-radius: 20px; background: rgba(255,255,255,.04);
}
.topbar .video-link:active { background: rgba(255,255,255,.12); }

main { flex: 1; padding: 0 16px 24px; display: flex; flex-direction: column; }

/* ---------- Home / level list ---------- */
.hero {
  background: linear-gradient(135deg, #15493a, #0c2b22);
  border-radius: 18px; padding: 16px 18px; margin: 6px 0 18px;
  border: 1px solid #2e5c48;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
.hero h2 { margin: 0 0 6px; font-size: 18px; color: #ffe9a8; }
.hero p { margin: 0; font-size: 13px; line-height: 1.6; color: #d9ead9; }
.hero .total-progress { margin-top: 12px; }

.level-list { display: flex; flex-direction: column; gap: 12px; }
.level-card {
  display: flex; align-items: center; gap: 14px;
  background: #0f3326; border: 1px solid #2c5744; border-radius: 16px;
  padding: 14px; position: relative; overflow: hidden;
  transition: transform .12s ease;
}
.level-card.locked { opacity: .5; }
.level-card:active:not(.locked) { transform: scale(0.98); }
.level-card .num {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(145deg,#d6c48a,#9c8a4d); color: #1c2a1f;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
}
.level-card.locked .num { background: #3a4a42; color: #8aa093; }
.level-card .info { flex: 1; min-width: 0; }
.level-card .info .lt { font-size: 15px; font-weight: 700; color: #f6f1e3; }
.level-card .info .ls { font-size: 12px; color: #9fc4ae; margin-top: 2px; }
.level-card .badge {
  font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 700;
  background: #1c4433; color: #8fe8b4; border: 1px solid #2c6b4e; white-space: nowrap;
}
.level-card .badge.cleared { background: #2c6b4e; color: #e9fff1; }
.level-card .lock-icon { font-size: 18px; color: #7c9088; }

/* ---------- Level intro ---------- */
.rule-box {
  background: #0f3326; border: 1px solid #2c5744; border-radius: 16px;
  padding: 16px; margin-bottom: 18px;
}
.rule-box h3 { margin: 0 0 8px; color: #ffe9a8; font-size: 16px; }
.rule-box p { margin: 0; font-size: 13.5px; line-height: 1.75; color: #e4ece4; }

/* ---------- Buttons ---------- */
.btn {
  display: block; width: 100%; text-align: center; border: none; cursor: pointer;
  padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 700;
  background: linear-gradient(145deg,#d6c48a,#b89f5d); color: #16251c;
  box-shadow: 0 4px 10px rgba(0,0,0,.35);
}
.btn:active { transform: translateY(1px); }
.btn.secondary {
  background: transparent; color: #cfe8d8; border: 1px solid #3f6f58;
  box-shadow: none; font-weight: 600;
}
.btn.ghost { background: transparent; color: #9fc4ae; border: none; box-shadow: none; font-weight: 600; font-size: 14px; padding: 10px; }

/* ---------- Progress bar ---------- */
.progress-wrap { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; }
.progress-bar { flex: 1; height: 8px; border-radius: 6px; background: #163024; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg,#8fe8b4,#d6c48a); border-radius: 6px; transition: width .25s ease; }
.progress-label { font-size: 12px; color: #bcd9c7; min-width: 44px; text-align: right; }

/* ---------- Question screen ---------- */
.q-header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
.q-header .lv-name { font-size: 13px; color: #9fc4ae; font-weight: 700; }
.q-header .q-count { font-size: 13px; color: #ffe9a8; font-weight: 700; }

.context-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip {
  font-size: 11.5px; background: rgba(255,255,255,.06); color: #cfe8d8;
  border: 1px solid rgba(255,255,255,.12); padding: 4px 10px; border-radius: 20px;
}

.table-felt {
  background: radial-gradient(ellipse at center, #1b5c45, #0e3627);
  border: 1px solid #2c5744; border-radius: 16px; padding: 16px 10px;
  margin-bottom: 14px; box-shadow: inset 0 2px 10px rgba(0,0,0,.35);
}
.hand-row {
  display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
}
.tile {
  width: 30px; height: 42px; background: #fffdf7; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; position: relative;
  box-shadow: 0 2px 0 #c9c2ad, 0 3px 5px rgba(0,0,0,.4);
  border: 1px solid #e3dcc8; flex-shrink: 0;
}
.tile.m { color: #c0392b; }
.tile.p { color: #1f5fa8; }
.tile.s { color: #1e7e42; }
.tile.z { color: #2b2b2b; }
.tile .suit-mark { position: absolute; bottom: 2px; font-size: 8px; opacity: .6; }
.tile.haku { color: transparent; }
.tile.haku::after {
  content: ""; position: absolute; inset: 4px; border: 2px solid #1f5fa8; border-radius: 2px;
}
.tile.chun { color: #c0392b; }
.tile.hatsu { color: #1e7e42; }

.prompt-box {
  background: #142e24; border-left: 4px solid #d6c48a; border-radius: 10px;
  padding: 14px 14px; margin-bottom: 16px;
}
.prompt-box p { margin: 0; font-size: 15.5px; line-height: 1.6; font-weight: 600; color: #fbf6e6; }

.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
.option-btn {
  text-align: left; background: #123528; border: 1.5px solid #2c5744; color: #f1f5f1;
  border-radius: 12px; padding: 13px 14px; font-size: 14.5px; line-height: 1.5;
  cursor: pointer; display: flex; gap: 10px; align-items: flex-start;
}
.option-btn .letter {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: #2c5744;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #d6f0e0;
}
.option-btn:active { background: #194838; }
.option-btn.correct { background: #1f5c3a; border-color: #4caf7d; }
.option-btn.correct .letter { background: #4caf7d; color: #0a2a20; }
.option-btn.wrong { background: #5c2424; border-color: #c0392b; }
.option-btn.wrong .letter { background: #c0392b; color: #fff; }
.option-btn.disabled { pointer-events: none; }
.option-btn.dim { opacity: .5; }

.feedback {
  border-radius: 12px; padding: 14px; margin: 4px 0 16px; font-size: 13.5px; line-height: 1.7;
  display: none;
}
.feedback.show { display: block; }
.feedback.ok { background: #16422c; border: 1px solid #4caf7d; color: #d8f5e4; }
.feedback.ng { background: #4a1f1f; border: 1px solid #c0392b; color: #fbdede; }
.feedback .fb-title { font-weight: 800; font-size: 14px; margin-bottom: 6px; }

.bottom-bar { margin-top: auto; padding-top: 8px; }

/* ---------- Result screen ---------- */
.result-card {
  text-align: center; background: #0f3326; border: 1px solid #2c5744; border-radius: 18px;
  padding: 28px 20px; margin-bottom: 18px;
}
.result-card .score-circle {
  width: 128px; height: 128px; border-radius: 50%; margin: 0 auto 14px;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  background: conic-gradient(var(--c, #4caf7d) calc(var(--p,0) * 1%), #163024 0);
  position: relative;
}
.result-card .score-circle::before {
  content: ""; position: absolute; inset: 10px; background: #0f3326; border-radius: 50%;
}
.result-card .score-circle .num { position: relative; font-size: 30px; font-weight: 800; color: #ffe9a8; }
.result-card .score-circle .den { position: relative; font-size: 12px; color: #bcd9c7; }
.result-card h2 { margin: 0 0 6px; font-size: 20px; }
.result-card.pass h2 { color: #8fe8b4; }
.result-card.fail h2 { color: #ffb199; }
.result-card p { font-size: 13px; color: #cfe8d8; margin: 0; }

.review-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.review-item {
  display: flex; gap: 10px; align-items: flex-start; background: #0f3326;
  border: 1px solid #2c5744; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: #dcebe1;
}
.review-item .mark { font-size: 16px; }
.review-item.wrong { border-color: #6b3030; background: #2a1414; }

footer.copyright { text-align: center; font-size: 11px; color: #5e7a6c; padding: 10px 0 18px; }

</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   省エネ麻雀道場 - 問題データ
   出典: 麻雀Jewelチャンネル「麻雀の新常識【弱者が最短で強者に化ける方法】
          -省エネ麻雀- 解説編」(武井雄哉 解説) の内容整理に基づく練習問題
   ========================================================= */

const PASS_RATE = 0.8; // 次のレベルに進むための正答率

const LEVELS = [
  {
    id: 1,
    title: "配牌の方針",
    subtitle: "狙う役を4つから選ぶ",
    rule: "役牌が対子→役牌／19字牌を含む面子が無い→タンヤオ／字牌が2種以上対子(または1種対子+同色数牌6枚程度)→ホンイツ／それ以外はすべてリーチ(標準進行)。トイトイ・七対子は原則狙わない。そして配牌は絶対に降りない――アガリに向かうことこそ最大の守備。",
    questions: [
      {
        hand: ["中","中","2m","4m","6m","7p","8p","3s","5s","7s","北","南","9s"],
        context: ["配牌直後", "役牌(中)が対子"],
        prompt: "この配牌、まず目指すべき役は？",
        options: [
          { t: "役牌", c: true },
          { t: "タンヤオ", c: false },
          { t: "ホンイツ", c: false },
          { t: "リーチ(標準進行)", c: false },
        ],
        explain: "役牌が対子になっている場合は、まずその役牌を狙うのが省エネ麻雀の基準です。",
      },
      {
        hand: ["3m","4m","5m","6p","7p","8p","2s","3s","4s","5s","6s","7s","8s"],
        context: ["配牌直後", "19牌・字牌を含む面子が無い", "染め要素なし"],
        prompt: "この配牌、まず目指すべき役は？",
        options: [
          { t: "役牌", c: false },
          { t: "タンヤオ", c: true },
          { t: "ホンイツ", c: false },
          { t: "リーチ(標準進行)", c: false },
        ],
        explain: "19字牌を含む面子が無い配牌は、タンヤオを狙うのが基準です。",
      },
      {
        hand: ["東","東","發","發","2s","3s","4s","5s","6s","7s","8s","9s","南"],
        context: ["配牌直後", "字牌が2種類(東・發)で対子"],
        prompt: "この配牌、まず目指すべき役は？",
        options: [
          { t: "役牌(東を本命に)", c: false },
          { t: "タンヤオ", c: false },
          { t: "ホンイツ", c: true },
          { t: "リーチ(標準進行)", c: false },
        ],
        explain: "字牌が2種以上対子になっている場合はホンイツを狙うのが基準です。",
      },
      {
        hand: ["1m","2m","3m","2m","5m","6m","4p","5p","6p","7s","8s","9s","東"],
        context: ["配牌直後", "役牌の対子なし", "染め要素なし", "19字牌を含む面子(123m・789s)あり"],
        prompt: "この配牌、まず目指すべき役は？",
        options: [
          { t: "役牌", c: false },
          { t: "タンヤオ", c: false },
          { t: "ホンイツ", c: false },
          { t: "リーチ(標準進行)", c: true },
        ],
        explain: "役牌対子・染め・タンヤオ条件のいずれにも当てはまらない配牌は、標準進行＝リーチを目指します。",
      },
      {
        hand: ["2m","2m","5p","5p","7p","7p","3s","3s","6s","6s","東","東","9p"],
        context: ["配牌直後", "対子だらけでトイトイが見えそうな形"],
        prompt: "この配牌の扱いとして正しいのは？",
        options: [
          { t: "トイトイを積極的に狙う", c: false },
          { t: "トイトイは原則存在しない役として忘れ、他の4役の基準で考え直す", c: true },
          { t: "七対子に切り替える", c: false },
          { t: "配牌が悪いので守備に回る", c: false },
        ],
        explain: "省エネ麻雀ではトイトイも七対子も「原則存在しない役」として扱い、忘れます。対子はあくまで役牌・ホンイツ判定の材料として見ます。",
      },
      {
        hand: ["白","白","3m","4m","5m","6p","7p","8p","2s","3s","4s","5s","7s"],
        context: ["配牌直後", "役牌(白)が対子", "同時に19字牌を含む面子も無い(タンヤオ条件も満たす)"],
        prompt: "役牌対子とタンヤオ条件の両方を満たしている。どちらを優先する？",
        options: [
          { t: "役牌を優先する", c: true },
          { t: "タンヤオを優先する", c: false },
          { t: "両方同時に狙うので判断は不要", c: false },
          { t: "ホンイツに変更する", c: false },
        ],
        explain: "判定の優先順位は「役牌対子→タンヤオ→ホンイツ→リーチ」。複数条件を満たす場合は役牌が最優先です。",
      },
      {
        hand: ["1m","3m","1p","3p","7s","9s","2m","4m","6p","8p","東","南","西"],
        context: ["配牌直後", "ペンチャン・カンチャンだらけ", "ドラなし", "形が非常に悪い"],
        prompt: "配牌が非常に悪い。省エネ麻雀としてどう考えるべき？",
        options: [
          { t: "配牌が悪いので守備に回る(降りる)", c: false },
          { t: "悪くても基本通りアガリに向かう(牌効率優先で進める)", c: true },
          { t: "七対子に狙いを変える", c: false },
          { t: "様子を見てから決める", c: false },
        ],
        explain: "配牌を見て降りるという選択肢はこの戦術にはありません。アガリに向かうことが最大の守備であり、平均的な相手なら有効牌を数枚引くだけで手は化けます。",
      },
      {
        hand: ["發","發","2s","3s","4s","5s","6s","7s","1m","9m","東","南","西"],
        context: ["配牌直後", "字牌は發のみ対子", "同色(索子)の数牌が6枚程度集まっている"],
        prompt: "この配牌、まず目指すべき役は？",
        options: [
          { t: "役牌", c: false },
          { t: "タンヤオ", c: false },
          { t: "ホンイツ", c: true },
          { t: "リーチ(標準進行)", c: false },
        ],
        explain: "字牌が1種対子で、同じ色の数牌が6枚程度集まっている場合もホンイツ判定の条件に合致します。",
      },
    ],
  },

  {
    id: 2,
    title: "序盤の切り順",
    subtitle: "オタ風→19牌→役牌→孤立28→ペンチャンの固定順",
    rule: "第一打はホンイツを見る場合を除きオタ風(客風)。以降は19牌→役牌→孤立28牌→ペンチャンの順で払う。字牌同士は、場に切れている枚数が多い方(重なりにくい方)から切り、攻撃力が同じなら守備力(放銃時に翻がつかない方)が高い方を残す。14・69筋の19牌はオタ風より先に切り、1-5の関係にある孤立1はオタ風より強い。親番は東を残し先に見えている役牌から切る。",
    questions: [
      {
        hand: ["南","1m","4m","7m","2p","5p","8p","3s","6s","9s","白","發","中"],
        context: ["配牌直後", "タンヤオでもホンイツでもない普通の配牌"],
        prompt: "第一打として最も適切なのは？",
        options: [
          { t: "客風(南)", c: true },
          { t: "19牌", c: false },
          { t: "役牌(白)", c: false },
          { t: "孤立の28牌", c: false },
        ],
        explain: "ホンイツを見ない通常の配牌では、第一打は客風(オタ風)から切るのが固定ルールです。",
      },
      {
        hand: ["南","發","發","2s","3s","4s","5s","6s","7s","9s","4p","白","東"],
        context: ["配牌直後", "ホンイツ(索子)を狙う方針が確定"],
        prompt: "ホンイツを目指す場合の序盤の切り順として正しいのは？",
        options: [
          { t: "いつも通りまず客風(南)から切る", c: false },
          { t: "客風は様子見して、染まらない色のペンチャンや孤立28牌から切る", c: true },
          { t: "役牌(發)から切る", c: false },
          { t: "19牌から切る", c: false },
        ],
        explain: "ホンイツを見ている時は、客風を先に切らず、染まらない色の牌(この場合4pなど)から処理します。",
      },
      {
        hand: ["南","1m","4m","3p","5p","7p","2s","5s","8s","白","發","中","9m"],
        context: ["配牌直後", "客風の南と、1-4筋の孤立1萬を持っている"],
        prompt: "南と1萬、先に切るべきはどちら？",
        options: [
          { t: "南(客風)から切る", c: false },
          { t: "1萬(14筋の19牌)から切る", c: true },
          { t: "どちらでもよい", c: false },
          { t: "ドラ次第で決める", c: false },
        ],
        explain: "14・69の筋で持っている19牌は、対子になった時の受け入れ枚数がオタ風と同じなのに守備力だけが低いため、オタ風より先に切ります。",
      },
      {
        hand: ["1m","5m","南","3p","6p","8p","2s","4s","7s","9s","發","中","白"],
        context: ["孤立の1萬と5萬を両方持っている(1-5の関係)"],
        prompt: "この1萬の価値評価として正しいのは？",
        options: [
          { t: "他の孤立19牌と同じ価値", c: false },
          { t: "他の孤立19牌より強い(オタ風より優先して残すが役牌ほどではない)", c: true },
          { t: "オタ風より弱い", c: false },
          { t: "即切るべき牌", c: false },
        ],
        explain: "1-5の関係で持っている1は、他の孤立19牌より価値が高く、オタ風より優先して残します(ただし役牌ほどの価値ではありません)。",
      },
      {
        hand: ["東","南","3m","5m","7m","2p","4p","6p","8s","9s","發","中","白"],
        context: ["場に東が1枚切れ、南は0枚切れ", "他の条件(枚数など)は同じ"],
        prompt: "東と南、どちらを先に切るべき？",

<script>
/* =========================================================
   省エネ麻雀道場 - アプリロジック
   ========================================================= */

const STORAGE_KEY = "shouene_mahjong_dojo_v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const init = {};
  LEVELS.forEach((l, i) => {
    init[l.id] = { unlocked: i === 0, best: 0, cleared: false };
  });
  return init;
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
let progress = loadProgress();
// backfill in case new levels were added
LEVELS.forEach((l, i) => {
  if (!progress[l.id]) progress[l.id] = { unlocked: i === 0, best: 0, cleared: false };
});
saveProgress(progress);

/* ---------- Tile rendering ---------- */
const HONOR_MAP = {
  "東": { cls: "z", label: "東" },
  "南": { cls: "z", label: "南" },
  "西": { cls: "z", label: "西" },
  "北": { cls: "z", label: "北" },
  "白": { cls: "haku", label: "白" },
  "發": { cls: "hatsu", label: "發" },
  "中": { cls: "chun", label: "中" },
};
function tileEl(code) {
  const div = document.createElement("div");
  div.className = "tile";
  const suitChar = code.length >= 2 ? code[code.length - 1] : "";
  if (["m", "p", "s"].includes(suitChar)) {
    const num = code.slice(0, -1);
    div.classList.add(suitChar);
    div.textContent = num;
    const mark = document.createElement("span");
    mark.className = "suit-mark";
    mark.textContent = suitChar === "m" ? "萬" : suitChar === "p" ? "筒" : "索";
    div.appendChild(mark);
  } else if (HONOR_MAP[code]) {
    const h = HONOR_MAP[code];
    div.classList.add(h.cls);
    div.textContent = h.label;
  } else {
    div.textContent = code;
  }
  return div;
}

/* ---------- App State ---------- */
const app = document.getElementById("app");
let state = {
  screen: "home", // home | intro | question | result
  levelId: null,
  qIndex: 0,
  order: [],
  answers: [], // {qIndex, correct}
  answered: false,
};

function currentLevel() {
  return LEVELS.find((l) => l.id === state.levelId);
}
function shuffledIndices(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---------- Screens ---------- */
function render() {
  app.innerHTML = "";
  app.appendChild(renderTopbar());
  const main = document.createElement("main");
  if (state.screen === "home") main.appendChild(renderHome());
  else if (state.screen === "intro") main.appendChild(renderIntro());
  else if (state.screen === "question") main.appendChild(renderQuestion());
  else if (state.screen === "result") main.appendChild(renderResult());
  app.appendChild(main);
  const foot = document.createElement("footer");
  foot.className = "copyright";
  foot.textContent = "省エネ麻雀 練習ツール（非公式・学習用）";
  app.appendChild(foot);
}

function renderTopbar() {
  const bar = document.createElement("div");
  bar.className = "topbar";
  const brand = document.createElement("div");
  brand.className = "brand";
  const icon = document.createElement("div");
  icon.className = "tile-icon";
  icon.textContent = "發";
  const h1 = document.createElement("h1");
  h1.textContent = "省エネ麻雀道場";
  brand.appendChild(icon);
  brand.appendChild(h1);
  bar.appendChild(brand);
  const link = document.createElement("a");
  link.className = "video-link";
  link.href = "https://www.youtube.com/watch?v=cW2v-N1rZEs";
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "解説動画";
  bar.appendChild(link);
  return bar;
}

function overallStats() {
  let cleared = 0;
  LEVELS.forEach((l) => { if (progress[l.id].cleared) cleared++; });
  return { cleared, total: LEVELS.length };
}

function renderHome() {
  const frag = document.createDocumentFragment();

  const hero = document.createElement("div");
  hero.className = "hero";
  const st = overallStats();
  hero.innerHTML = `
    <h2>武井流・省エネ麻雀 実戦ドリル</h2>
    <p>配牌を見てどの役を目指すか、何を切るか、押すか降りるか、鳴くか――解説動画の流れに沿って、レベル別に練習できます。各レベルは正答率80%以上で次に進めます。</p>
  `;
  const prog = document.createElement("div");
  prog.className = "total-progress";
  prog.appendChild(progressBar(st.cleared, st.total));
  hero.appendChild(prog);
  frag.appendChild(hero);

  const list = document.createElement("div");
  list.className = "level-list";
  LEVELS.forEach((l, i) => {
    const p = progress[l.id];
    const card = document.createElement("div");
    card.className = "level-card" + (p.unlocked ? "" : " locked");
    const num = document.createElement("div");
    num.className = "num";
    num.textContent = i + 1;
    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `<div class="lt">${l.title}</div><div class="ls">${l.subtitle}</div>`;
    card.appendChild(num);
    card.appendChild(info);
    if (p.unlocked) {
      const badge = document.createElement("div");
      badge.className = "badge" + (p.cleared ? " cleared" : "");
      badge.textContent = p.cleared ? `クリア ${Math.round(p.best * 100)}%` : "挑戦可能";
      card.appendChild(badge);
      card.addEventListener("click", () => {
        state.screen = "intro";
        state.levelId = l.id;
        render();
      });
    } else {
      const lock = document.createElement("div");
      lock.className = "lock-icon";
      lock.textContent = "🔒";
      card.appendChild(lock);
    }
    list.appendChild(card);
  });
  frag.appendChild(list);
  return frag;
}

function progressBar(done, total) {
  const wrap = document.createElement("div");
  wrap.className = "progress-wrap";
  const bar = document.createElement("div");
  bar.className = "progress-bar";
  const fill = document.createElement("div");
  fill.className = "progress-fill";
  fill.style.width = `${total ? (done / total) * 100 : 0}%`;
  bar.appendChild(fill);
  const label = document.createElement("div");
  label.className = "progress-label";
  label.textContent = `${done}/${total}`;
  wrap.appendChild(bar);
  wrap.appendChild(label);
  return wrap;
}

function renderIntro() {
  const l = currentLevel();
  const p = progress[l.id];
  const frag = document.createDocumentFragment();

  const back = document.createElement("button");
  back.className = "btn ghost";
  back.textContent = "← レベル一覧へ戻る";
  back.style.textAlign = "left";
  back.style.padding = "6px 0 14px";
  back.addEventListener("click", () => { state.screen = "home"; render(); });
  frag.appendChild(back);

  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = `<h2>Lv.${l.id} ${l.title}</h2><p>${l.subtitle}</p>`;
  frag.appendChild(hero);

  const ruleBox = document.createElement("div");
  ruleBox.className = "rule-box";
  ruleBox.innerHTML = `<h3>このレベルのルール</h3><p>${l.rule}</p>`;
  frag.appendChild(ruleBox);

  if (p.cleared) {
    const info = document.createElement("div");
    info.className = "rule-box";
    info.innerHTML = `<h3>これまでの最高正答率</h3><p>${Math.round(p.best * 100)}%（合格ライン ${Math.round(PASS_RATE * 100)}%）</p>`;
    frag.appendChild(info);
  }

  const start = document.createElement("button");
  start.className = "btn";
  start.textContent = `全${l.questions.length}問 スタート`;
  start.addEventListener("click", () => {
    state.screen = "question";
    state.order = shuffledIndices(l.questions.length);
    state.qIndex = 0;
    state.answers = [];
    state.answered = false;
    render();
  });
  frag.appendChild(start);

  return frag;
}

function renderQuestion() {
  const l = currentLevel();
  const qi = state.order[state.qIndex];
  const q = l.questions[qi];
  const frag = document.createDocumentFragment();

  const qHeader = document.createElement("div");
  qHeader.className = "q-header";
  qHeader.innerHTML = `<div class="lv-name">Lv.${l.id} ${l.title}</div><div class="q-count">${state.qIndex + 1} / ${l.questions.length}</div>`;
  frag.appendChild(qHeader);

  const bar = document.createElement("div");
  bar.className = "progress-bar";
  bar.style.marginBottom = "14px";
  const fill = document.createElement("div");
  fill.className = "progress-fill";
  fill.style.width = `${(state.qIndex / l.questions.length) * 100}%`;
  bar.appendChild(fill);
  frag.appendChild(bar);

  if (q.context && q.context.length) {
    const chips = document.createElement("div");
    chips.className = "context-chips";
    q.context.forEach((c) => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = c;
      chips.appendChild(chip);
    });
    frag.appendChild(chips);
  }

  const felt = document.createElement("div");
  felt.className = "table-felt";
  const row = document.createElement("div");
  row.className = "hand-row";
  q.hand.forEach((t) => row.appendChild(tileEl(t)));
  felt.appendChild(row);
  frag.appendChild(felt);

  const promptBox = document.createElement("div");
  promptBox.className = "prompt-box";
  const p = document.createElement("p");
  p.textContent = q.prompt;
  promptBox.appendChild(p);
  frag.appendChild(promptBox);

  const optionsWrap = document.createElement("div");
  optionsWrap.className = "options";
  const letters = ["A", "B", "C", "D"];
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt.t}</span>`;
    btn.addEventListener("click", () => handleAnswer(qi, opt, btn, optionsWrap));
    optionsWrap.appendChild(btn);
  });
  frag.appendChild(optionsWrap);

  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.id = "feedback-box";
  frag.appendChild(feedback);

  const bottom = document.createElement("div");
  bottom.className = "bottom-bar";
  const nextBtn = document.createElement("button");
  nextBtn.className = "btn";
  nextBtn.id = "next-btn";
  nextBtn.textContent = state.qIndex + 1 < l.questions.length ? "次の問題へ" : "結果を見る";
  nextBtn.style.display = "none";
  nextBtn.addEventListener("click", () => {
    if (state.qIndex + 1 < l.questions.length) {
      state.qIndex++;
      state.answered = false;
      render();
    } else {
      finishLevel();
    }
  });
  bottom.appendChild(nextBtn);
  frag.appendChild(bottom);

  return frag;
}

function handleAnswer(qi, opt, btnEl, optionsWrap) {
  if (state.answered) return;
  state.answered = true;
  const buttons = optionsWrap.querySelectorAll(".option-btn");
  buttons.forEach((b) => {
    b.classList.add("disabled");
  });
  const l = currentLevel();
  const q = l.questions[qi];
  buttons.forEach((b, idx) => {
    if (q.options[idx].c) b.classList.add("correct");
    else if (b === btnEl) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const correct = !!opt.c;
  state.answers.push({ qi, correct });

  const fb = document.getElementById("feedback-box");
  fb.classList.add("show", correct ? "ok" : "ng");
  fb.innerHTML = `<div class="fb-title">${correct ? "○ 正解！" : "✗ 不正解"}</div><div>${q.explain}</div>`;

  document.getElementById("next-btn").style.display = "block";
  document.getElementById("next-btn").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function finishLevel() {
  const l = currentLevel();
  const correctCount = state.answers.filter((a) => a.correct).length;
  const rate = correctCount / l.questions.length;
  const p = progress[l.id];
  p.best = Math.max(p.best, rate);
  const passed = rate >= PASS_RATE;
  if (passed) {
    p.cleared = true;
    const idx = LEVELS.findIndex((x) => x.id === l.id);
    if (idx + 1 < LEVELS.length) {
      const nextId = LEVELS[idx + 1].id;
      progress[nextId].unlocked = true;
    }
  }
  saveProgress(progress);
  state.screen = "result";
  state._lastResult = { correctCount, total: l.questions.length, rate, passed };
  render();
}

function renderResult() {
  const l = currentLevel();
  const r = state._lastResult;
  const frag = document.createDocumentFragment();

  const card = document.createElement("div");
  card.className = "result-card " + (r.passed ? "pass" : "fail");
  const pct = Math.round(r.rate * 100);
  card.innerHTML = `
    <div class="score-circle" style="--p:${pct}; --c:${r.passed ? "#4caf7d" : "#e08a6a"}">
      <div class="num">${pct}%</div>
      <div class="den">${r.correctCount} / ${r.total} 問正解</div>
    </div>
    <h2>${r.passed ? "合格！次のレベルへ進めます" : "もう一息"}</h2>
    <p>合格ライン：正答率 ${Math.round(PASS_RATE * 100)}%</p>
  `;
  frag.appendChild(card);

  const review = document.createElement("div");
  review.className = "review-list";
  state.answers.forEach((a) => {
    const q = l.questions[a.qi];
    const item = document.createElement("div");
    item.className = "review-item" + (a.correct ? "" : " wrong");
    item.innerHTML = `<span class="mark">${a.correct ? "○" : "✗"}</span><span>${q.prompt}</span>`;
    review.appendChild(item);
  });
  frag.appendChild(review);

  const retry = document.createElement("button");
  retry.className = "btn secondary";
  retry.textContent = "このレベルをもう一度";
  retry.style.marginBottom = "10px";
  retry.addEventListener("click", () => {
    state.screen = "question";
    state.order = shuffledIndices(l.questions.length);
    state.qIndex = 0;
    state.answers = [];
    state.answered = false;
    render();
  });
  frag.appendChild(retry);

  const idx = LEVELS.findIndex((x) => x.id === l.id);
  if (r.passed && idx + 1 < LEVELS.length) {
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn";
    nextBtn.style.marginBottom = "10px";
    nextBtn.textContent = `Lv.${LEVELS[idx + 1].id} ${LEVELS[idx + 1].title} へ進む`;
    nextBtn.addEventListener("click", () => {
      state.levelId = LEVELS[idx + 1].id;
      state.screen = "intro";
      render();
    });
    frag.appendChild(nextBtn);
  }

  const home = document.createElement("button");
  home.className = "btn ghost";
  home.textContent = "レベル一覧へ戻る";
  home.addEventListener("click", () => { state.screen = "home"; render(); });
  frag.appendChild(home);

  return frag;
}

render();

</script>
</body>
</html>
